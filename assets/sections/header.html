<!-- assets/sections/header.html -->
<header class="site-header">
  <div class="header-left">
    <button type="button" class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="left-menu">
      <span class="menu-toggle-bars" aria-hidden="true"></span>
      <span class="menu-toggle-text" data-i18n="header.t01">Menu</span>
    </button>
    <div class="brand">
      <p class="brand-eyebrow" data-i18n="header.t02">Simi Valley, California</p>
      <h1 class="brand-title" data-i18n="header.t03">The Nine Keys</h1>
    </div>
  </div>

  <div class="header-center">
    <p class="object-counter" id="object-counter" aria-live="polite">Objects found: 0 / 9</p>
    <ul class="object-icons" id="object-icons" data-i18n-attr="aria-label:header.iconsLabel" aria-label="Objects collected"></ul>
  </div>

  <div class="header-right">
    <div class="language-switch" id="language-switch" role="group" data-i18n-attr="aria-label:header.languageLabel" aria-label="Language"></div>
    <button type="button" class="btn btn-danger reset-button" id="reset-button" data-i18n="header.t05">
      <span aria-hidden="true">⚠️</span> Reset Hunt
    </button>
  </div>
</header>
